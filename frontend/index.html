<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Inicio de sesión - Panel de Monitoreo">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy"
        content="
        default-src 'self';
        connect-src 'self' https://capturechat-backend-v2-production.up.railway.app;
        img-src 'self' https://res.cloudinary.com https://capturechat-backend-v2-production.up.railway.app data: blob:;
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        ">

    <title>Login - Panel de Monitoreo</title>

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/login.css">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#d4af37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
    <div id="loginScreen">
        <div class="login-container">
            <div class="login-header">

                <!-- Logo: se carga desde localStorage si fue personalizado en Configuración -->
                <div class="login-logo" id="logoContainer">
                    <img id="logoImg" src="" alt="Logo"
                        style="display:none; width:100%; height:100%; object-fit:cover; border-radius:16px;">
                    <span id="logoEmoji">📸</span>
                </div>

                <!-- Nombre: se carga desde localStorage si fue personalizado en Configuración -->
                <h1 id="appName">Webcam Monitor Pro</h1>
                <p>Panel de Administración Seguro</p>
            </div>

            <div id="loginError"></div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario"
                        autocomplete="username" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>

            <div class="security-indicator">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                Conexión Segura con Encriptación
            </div>

            <div class="login-footer">
                <p id="footerAppName">Webcam Monitor Pro v2.0 - Seguro y Profesional</p>
            </div>
        </div>
    </div>

    <script src="./js/login.js"></script>

    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js")
                .then(reg => console.log("SW registrado:", reg.scope))
                .catch(err => console.error("Error SW:", err));
        });
    }
    </script>
</body>
</html>
